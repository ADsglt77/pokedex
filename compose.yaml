# Le site, servi en local sur le VPS ; le tunnel Cloudflare l'expose sur le domaine.
services:
  pokedex:
    build: .
    restart: unless-stopped
    # Seulement sur 127.0.0.1 : on n'y accède que par le tunnel, jamais directement.
    ports:
      - '127.0.0.1:${POKEDEX_PORT:-8080}:80'
    volumes:
      - prices:/usr/share/nginx/html/prices:ro

  # Prix Cardmarket (et TCGplayer pour les cartes du catalogue sans id Cardmarket) : regardés toutes
  # les 6 h (ils changent une fois par jour ; le script ne les retélécharge que s'ils ont changé),
  # écrits dans le volume que sert nginx. Après un échec (Cardmarket indisponible…), de nouveau
  # 10 min plus tard, puis 20, 40… jusqu'à 6 h : une panne qui dure ne fait pas télécharger
  # Cardmarket toutes les 10 min. (`$$` : un `$` pour le shell.)
  # Le code et le catalogue (`src/`) viennent du clone : un `git pull` suffit à les mettre à jour.
  prices:
    image: oven/bun:1-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./src:/app/src:ro
      - prices:/prices
    command: >-
      sh -c 'delay=600; while true; do
      if bun scripts/prices.ts /prices; then delay=600; sleep 21600;
      else sleep $$delay; delay=$$((delay * 2)); [ $$delay -gt 21600 ] && delay=21600;
      fi; done'

volumes:
  prices:
