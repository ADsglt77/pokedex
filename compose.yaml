# Le site, servi en local sur le VPS ; le tunnel Cloudflare l'expose sur le domaine.
# Les volumes portent des données irremplaçables (historique des prix, votre collection) : jamais
# `down -v`.
# Les journaux de chaque service : 3 fichiers de 10 Mo au plus (`ingest` tourne en boucle).
services:
  pokedex:
    build: { context: ., target: web }
    restart: unless-stopped
    logging: { options: { max-size: 10m, max-file: '3' } }
    # Seulement sur 127.0.0.1 : on n'y accède que par le tunnel, jamais directement.
    ports:
      - '127.0.0.1:${POKEDEX_PORT:-8080}:80'
    volumes:
      - images:/srv/images:ro
    depends_on: [server]

  # L'API (`server/index.ts`) : elle lit la base que remplit `ingest`, garde le compte et la
  # collection synchronisée (`app.db`), et copie à la demande une image qui manque. Joignable par
  # nginx seulement. Ses deux secrets viennent du fichier `.env` du clone (voir le README) : sans
  # eux, docker compose refuse de démarrer.
  server:
    build: { context: ., target: server }
    restart: unless-stopped
    # Un vrai processus 1 devant Bun : l'arrêt d'un déploiement lui parvient, sans 10 s d'attente.
    init: true
    logging: { options: { max-size: 10m, max-file: '3' } }
    environment:
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?l'adresse publique du site, dans .env (voir le README)}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?la clé des sessions, dans .env (voir le README)}
      ACCOUNT_EMAIL: ${ACCOUNT_EMAIL:?l'adresse de votre compte, seule à pouvoir le créer, dans .env (voir le README)}
    volumes:
      - db:/data
      - images:/images

  # Les tâches d'ingestion (`server/ingest.ts`), chacune à son rythme : les espèces chaque mois,
  # le catalogue chaque jour (le premier passage prend une vingtaine de minutes), les prix toutes
  # les 6 h (ils changent une fois par jour ; la tâche ne retélécharge que ce qui a changé), les
  # images chaque jour (le premier passage, environ 1,5 Go, prend une heure ou plus), les sauvegardes
  # des bases chaque jour. Après un échec, de nouveau 10 min plus tard, puis 20, 40… jusqu'à 6 h.
  # Même image que `server`.
  # L'ancien volume `prices` n'est lu qu'une fois : au premier démarrage, son historique est repris
  # (et vérifié) avant que la tâche `prices` n'écrive.
  ingest:
    build: { context: ., target: server }
    restart: unless-stopped
    init: true
    logging: { options: { max-size: 10m, max-file: '3' } }
    command: ['bun', 'server/ingest.ts', '--loop']
    environment:
      LEGACY_PRICES: /legacy-prices
    volumes:
      - db:/data
      - images:/images
      - backups:/backups
      - prices:/legacy-prices:ro

volumes:
  # Les bases SQLite (`data.db`, `app.db` : le compte et la collection) et le cache des
  # téléchargements.
  db:
  # Les images copiées chez nous (environ 1,5 Go) : cartes et Pokémon.
  images:
  # Les sauvegardes des bases, chaque jour (tâche `backups`) : à copier aussi hors du VPS.
  backups:
  # L'ancien service des prix (des fichiers, retiré) : son historique est repris dans `db` au
  # premier démarrage d'`ingest`. Gardé, au cas où ; à supprimer à la main quand tout va bien.
  prices:
