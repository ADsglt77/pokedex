# Le site, servi en local sur le VPS ; le tunnel Cloudflare l'expose sur le domaine.
services:
  pokedex:
    build: .
    restart: unless-stopped
    # Seulement sur 127.0.0.1 : on n'y accède que par le tunnel, jamais directement.
    ports:
      - '127.0.0.1:${POKEDEX_PORT:-8080}:80'
    volumes:
      - prices:/usr/share/nginx/html/prices:ro

  # Prix Cardmarket : relus toutes les 6 h (le guide change une fois par jour), écrits dans le
  # volume que sert nginx ; après un échec (Cardmarket indisponible…), de nouveau 10 min plus tard.
  # Le code vient du clone : un `git pull` suffit à le mettre à jour.
  prices:
    image: oven/bun:1-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - prices:/prices
    command: >-
      sh -c 'while true; do
      if bun scripts/prices.ts /prices; then sleep 21600; else sleep 600; fi;
      done'

volumes:
  prices:
