# Le site, servi en local sur le VPS ; le tunnel Cloudflare l'expose sur le domaine. Les données
# (espèces, catalogue, prix, images) viennent de l'API des données (le dépôt `pokedex-data`, son
# propre `compose.yaml`), jointe par le réseau Docker `pokedex-net` (créé une fois :
# `docker network create pokedex-net`, README) avec le token du site.
# Les volumes portent des données irremplaçables (votre collection) : jamais `down -v`.
# Les journaux de chaque service : 3 fichiers de 10 Mo au plus.
# Aucun service ne peut gagner de droits en cours de route (`no-new-privileges`) ; celui de Bun,
# sans droits d'administrateur, n'en garde aucun (`cap_drop`).
services:
  pokedex:
    build: { context: ., target: web }
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    logging: { options: { max-size: 10m, max-file: '3' } }
    # Seulement sur 127.0.0.1 : on n'y accède que par le tunnel, jamais directement.
    ports:
      - '127.0.0.1:${POKEDEX_PORT:-8080}:80'
    # Le token du site pour l'API des données : nginx le pose sur les demandes qu'il lui renvoie.
    environment:
      DATA_API_TOKEN: ${DATA_API_TOKEN:?le token du site pour l'API des données, dans .env (voir le README)}
    networks: [default, pokedex-net]
    depends_on: [server]

  # Le serveur de l'app (`server/index.ts`) : les comptes et les collections synchronisées
  # (`app.db`), et leurs sauvegardes, chaque jour. Joignable par nginx seulement. Ses réglages
  # (l'adresse du site, la clé des sessions, le token de l'API des données) viennent du fichier
  # `.env` du clone (voir le README) : sans eux, docker compose refuse de démarrer. Son état
  # (`docker compose ps`) : sain tant que `/api/account` répond.
  server:
    build: { context: ., target: server }
    restart: unless-stopped
    # Un vrai processus 1 devant Bun : l'arrêt d'un déploiement lui parvient, sans 10 s d'attente.
    init: true
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/api/account').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 1m
      timeout: 10s
      start_period: 30s
      retries: 3
    logging: { options: { max-size: 10m, max-file: '3' } }
    environment:
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?l'adresse publique du site, dans .env (voir le README)}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?la clé des sessions, dans .env (voir le README)}
      # Les prix d'un Pokédex public.
      DATA_API_URL: http://data-api:3001
      DATA_API_TOKEN: ${DATA_API_TOKEN:?le token du site pour l'API des données, dans .env (voir le README)}
    networks: [default, pokedex-net]
    volumes:
      - db:/data
      - backups:/backups

networks:
  # Partagé avec l'API des données (son `compose.yaml`) : créé une fois, à la main (README).
  pokedex-net:
    external: true

volumes:
  # La base SQLite (`app.db` : les comptes et les collections).
  db:
  # Les sauvegardes de la base, chaque jour : à copier aussi hors du VPS.
  backups:
