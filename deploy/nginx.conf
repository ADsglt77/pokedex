server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fichiers produits par Vite, au nom unique (empreinte) : gardés un an par les navigateurs.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Routage côté client : /pokedex, /pokemon/25… reçoivent index.html, toujours revalidé
    # pour qu'un déploiement soit vu tout de suite.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
