# Les images qui manquent encore, copiées à la demande par le serveur : 10 par seconde en moyenne,
# pour tout le site (derrière le tunnel, toutes les requêtes viennent de la même adresse).
limit_req_zone $binary_remote_addr zone=image_copies:1m rate=10r/s;

# Par visiteur : l'adresse que donne le tunnel Cloudflare (`cf-connecting-ip`), la seule qui le
# distingue (une requête sans elle, en local, n'est pas limitée). Les routes publiques coûteuses de
# l'API (jusqu'à une seconde de calcul pour les historiques de 1 025 cartes, sur la seule boucle
# du serveur) et la connexion : un visiteur ne peut pas bloquer le serveur, ni noyer son journal.
limit_req_zone $http_cf_connecting_ip zone=api_heavy:10m rate=2r/s;
limit_req_zone $http_cf_connecting_ip zone=api_auth:10m rate=2r/s;
limit_req_status 429;

# Les robots d'aperçu des messageries (Discord, WhatsApp…) qui lisent un lien partagé vers le Pokédex
# public d'un compte (`/@pseudo`) : ils ne lancent pas le JavaScript de l'app, le serveur leur fait
# une page à part, avec le pseudo et la progression (`/api/vitrine/<pseudo>/apercu`,
# `server/vitrine.ts`, la même liste).
map "$http_user_agent|$uri" $vitrine_preview {
    default 0;
    "~*(discordbot|whatsapp|facebookexternalhit|twitterbot|slackbot|telegrambot|linkedinbot|skypeuripreview|redditbot|embedly).*\|/@[A-Za-z0-9_-]+$" 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    # Ni la version de nginx dans les réponses, et les en-têtes de sécurité partout.
    server_tokens off;
    include /etc/nginx/security-headers.conf;
    # Une ligne de requête jusqu'à 16 Ko (8 Ko par défaut) : les 1 025 ids d'une collection
    # (`/api/histories?ids=…`, de 7 à 8 Ko) y tiennent, avec de la marge.
    large_client_header_buffers 4 16k;

    # Niveau 6 plutôt que 1 (le défaut) : le code rétrécit, pour un coût serveur négligeable.
    # `gzip_proxied` : les réponses de l'API aussi (celles déjà compressées par le serveur, en gzip
    # ou en Brotli, passent telles quelles). `text/javascript` : le type que donne nginx aux scripts
    # récents ; le manifeste de l'app aussi.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml;

    # Le serveur, retrouvé par le DNS de Docker à chaque requête (au plus 10 s de cache) : quand son
    # conteneur redémarre, il peut changer d'adresse ; résolue une fois au démarrage de nginx, elle
    # serait périmée (502) jusqu'au prochain redémarrage de nginx.
    resolver 127.0.0.11 valid=10s;
    set $server http://server:3000;

    # Fichiers produits par Vite, au nom unique (empreinte) : gardés un an par les navigateurs.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # L'API (service `server`) : elle donne elle-même ses en-têtes de cache. Des tampons d'1 Mo en
    # mémoire, assez pour presque toutes ses réponses ; une plus grosse (les historiques d'une
    # collection, plusieurs Mo) passe par un fichier temporaire si le navigateur la lit lentement.
    location /api/ {
        proxy_pass $server;
        proxy_set_header Host $host;
        client_max_body_size 5m;
        proxy_buffers 128 8k;
    }

    # Ses routes publiques coûteuses : 2 par seconde et par visiteur, 10 d'un coup au plus (la page
    # Valeur, « Copier pour Cardmarket » n'en demandent qu'une).
    location ~ ^/api/(histories|wants)$ {
        limit_req zone=api_heavy burst=10 nodelay;
        proxy_pass $server;
        proxy_set_header Host $host;
        proxy_buffers 128 8k;
    }

    # Le compte (Better Auth) : il limite déjà les tentatives de connexion et de création, mais une
    # déconnexion répétée passerait sans limite ; 20 d'un coup au plus.
    location /api/auth/ {
        limit_req zone=api_auth burst=20 nodelay;
        proxy_pass $server;
        proxy_set_header Host $host;
    }

    # Les images copiées chez nous (volume `images`) : gardées un an, sans redemande ; une image
    # copiée ne change jamais (le serveur ne réécrit pas un fichier qui existe). Celle qui manque
    # encore est demandée au serveur, qui la copie.
    location /images/ {
        root /srv;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @image_copy;
    }

    # `nodelay` : jusqu'à 60 copies d'un coup (une grille du catalogue pas encore copiée) passent
    # aussitôt, au lieu d'attendre leur tour un dixième de seconde chacune (4 s pour la 40e) ; le
    # serveur n'en copie que 4 à la fois.
    location @image_copy {
        limit_req zone=image_copies burst=60 nodelay;
        proxy_pass $server;
        proxy_set_header Host $host;
    }

    # Le manifeste de l'app (installable) : nginx ne connaît pas son type, et `nosniff` interdit au
    # navigateur de le deviner.
    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Routage côté client : /pokedex, /pokemon/25… reçoivent index.html, toujours revalidé
    # pour qu'un déploiement soit vu tout de suite.
    # Les aperçus de partage veulent l'adresse complète de leur image : celle du site demandé
    # (le tunnel le sert en https).
    location / {
        if ($vitrine_preview) {
            rewrite ^/@([A-Za-z0-9_-]+)$ /api/vitrine/$1/apercu last;
        }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        sub_filter 'property="og:image" content="/' 'property="og:image" content="https://$host/';
        try_files $uri /index.html;
    }
}
