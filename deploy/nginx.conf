# Les images qui manquent encore, copiées à la demande par le serveur : 10 par seconde au plus, pour
# tout le site (derrière le tunnel, toutes les requêtes viennent de la même adresse).
limit_req_zone $binary_remote_addr zone=image_copies:1m rate=10r/s;

server {
    listen 80;
    root /usr/share/nginx/html;

    # Niveau 6 plutôt que 1 (le défaut) : le code rétrécit, pour un coût serveur négligeable.
    # `gzip_proxied` : les réponses de l'API aussi (celles déjà compressées par le serveur, les prix
    # du jour, passent telles quelles).
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Le serveur, retrouvé par le DNS de Docker à chaque requête (au plus 10 s de cache) : quand son
    # conteneur redémarre, il peut changer d'adresse ; résolue une fois au démarrage de nginx, elle
    # serait périmée (502) jusqu'au prochain redémarrage de nginx.
    resolver 127.0.0.11 valid=10s;
    set $server http://server:3000;

    # Fichiers produits par Vite, au nom unique (empreinte) : gardés un an par les navigateurs.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # L'API (service `server`) : elle donne elle-même ses en-têtes de cache.
    location /api/ {
        proxy_pass $server;
        proxy_set_header Host $host;
        client_max_body_size 5m;
    }

    # Les images copiées chez nous (volume `images`) : gardées un mois, une image ne change pas.
    # Celle qui manque encore est demandée au serveur, qui la copie.
    location /images/ {
        root /srv;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @image_copy;
    }

    location @image_copy {
        limit_req zone=image_copies burst=40;
        proxy_pass $server;
        proxy_set_header Host $host;
    }

    # Routage côté client : /pokedex, /pokemon/25… reçoivent index.html, toujours revalidé
    # pour qu'un déploiement soit vu tout de suite.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
