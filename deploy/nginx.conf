server {
    listen 80;
    root /usr/share/nginx/html;

    # Niveau 6 plutôt que 1 (le défaut) : les prix du jour passent de 555 à 462 Ko, le code aussi
    # rétrécit, pour un coût serveur négligeable.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fichiers produits par Vite, au nom unique (empreinte) : gardés un an par les navigateurs.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Prix Cardmarket du jour et leur historique (service `prices`) : toujours revalidés.
    location /prices/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Routage côté client : /pokedex, /pokemon/25… reçoivent index.html, toujours revalidé
    # pour qu'un déploiement soit vu tout de suite.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
