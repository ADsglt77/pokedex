# Les en-têtes de sécurité du site, inclus au niveau du serveur et dans chaque `location` qui a ses
# propres `add_header` (nginx n'hérite alors plus de ceux du niveau au-dessus).
# - pas de type deviné pour un fichier ;
# - l'adresse d'origine réduite au site quand on suit un lien externe (Cardmarket, Pokécardex) ;
# - le site ne s'affiche pas dans le cadre d'un autre ;
# - ni caméra, ni micro, ni position.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
