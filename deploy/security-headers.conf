# Les en-têtes de sécurité du site, inclus au niveau du serveur et dans chaque `location` qui a ses
# propres `add_header` (nginx n'hérite alors plus de ceux du niveau au-dessus).
# - le site en https seulement pendant un an, même tapé en http (le tunnel Cloudflare le sert en
#   https ; en http, en local, le navigateur l'ignore) ;
# - pas de type deviné pour un fichier ;
# - l'adresse d'origine réduite au site quand on suit un lien externe (Cardmarket) ;
# - le site ne s'affiche pas dans le cadre d'un autre ;
# - ni caméra, ni micro, ni position ;
# - la politique de sécurité du contenu (CSP) : scripts, polices, requêtes et cadres du site seulement
#   (un script injecté ne s'exécuterait pas), plus les petites polices que Vite intègre (`data:`) ;
#   les images aussi d'ailleurs en https, pour l'adresse d'image collée dans une carte ; les styles
#   en ligne de React et de camply acceptés ; le service worker du site (`public/sw.js`).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
