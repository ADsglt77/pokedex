# Lancé à la main (onglet Actions de GitHub, « Run workflow ») : le VPS récupère le code et
# reconstruit le conteneur. Si la construction échoue, l'ancien conteneur continue de tourner.
# Le domaine n'est pas encore prêt : quand il le sera, remettre le déploiement à chaque push sur
# main en ajoutant, au-dessus de `workflow_dispatch` :
#   push:
#     branches: [main]
name: Déploiement

on:
  workflow_dispatch:

# Le job n'utilise pas le jeton GitHub.
permissions: {}

# Un déploiement à la fois, sans annuler celui qui tourne.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Sans empreinte, l'action se connecterait à n'importe quel hôte qui répond à l'adresse : elle
      # lui donnerait la clé SSH. Le déploiement s'arrête donc tant que le secret manque.
      - name: Vérifier que l'empreinte du VPS est connue
        env:
          FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
        run: test -n "$FINGERPRINT" || { echo "Secret VPS_FINGERPRINT manquant (voir le README)."; exit 1; }
      - name: Mettre à jour le VPS et reconstruire le site
        # Épinglée sur un commit : une étiquette peut être déplacée, et l'action reçoit la clé SSH.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Empreinte de la clé d'hôte du VPS (SHA256:…), exigée par l'étape d'avant.
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          # Le premier passage reconstruit tout (une dizaine de minutes sur un petit VPS) : au-delà
          # des 10 min par défaut, l'action couperait la construction en route.
          command_timeout: 30m
          # Le code d'abord, puis le script de déploiement tel qu'il vient d'arriver (construction,
          # redémarrage, vérification que le site répond) : `deploy/deploy.sh`.
          script: |
            set -e
            cd "${{ secrets.VPS_PATH }}"
            git pull --ff-only
            sh deploy/deploy.sh
