# À chaque push sur main : le VPS récupère le code et reconstruit le conteneur.
# Si la construction échoue, l'ancien conteneur continue de tourner.
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

# Le job n'utilise pas le jeton GitHub.
permissions: {}

# Un déploiement à la fois, sans annuler celui qui tourne.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Mettre à jour le VPS et reconstruire le site
        # Épinglée sur un commit : une étiquette peut être déplacée, et l'action reçoit la clé SSH.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Empreinte de la clé d'hôte du VPS (SHA256:…) ; vide, elle n'est pas vérifiée.
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          script: |
            set -e
            cd "${{ secrets.VPS_PATH }}"
            git pull --ff-only
            # `--pull` : les images de base (nginx, bun) reçoivent leurs correctifs.
            docker compose pull prices
            docker compose build --pull
            docker compose up -d
            docker image prune -f
