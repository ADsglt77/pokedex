# À chaque push sur main : le VPS récupère le code et reconstruit le conteneur.
# Si la construction échoue, l'ancien conteneur continue de tourner.
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un déploiement à la fois, sans annuler celui qui tourne.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Mettre à jour le VPS et reconstruire le site
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_PATH }}"
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
