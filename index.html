<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mon Pokédex de cartes Pokémon japonaises." />
    <meta name="theme-color" content="#141414" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mon Pokédex</title>
    <script>
      // Le thème, posé avant le premier affichage (sans éclair de l'autre) : celui choisi dans ce
      // navigateur, sinon (aucun choix, valeur inconnue, stockage bloqué) celui du système. La
      // même règle que `src/store/theme.ts`.
      {
        let stored = null
        try {
          stored = localStorage.getItem('pokedex-collection.theme')
        } catch {}
        const system = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        const theme = stored === 'light' || stored === 'dark' ? stored : system
        if (theme === 'light') {
          document.documentElement.dataset.camplyTheme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#faf6f3'
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
