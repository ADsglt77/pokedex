<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Un Pokédex de cartes Pokémon japonaises et françaises : une carte par Pokémon, à collectionner."
    />
    <meta name="theme-color" content="#141414" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable sur téléphone et ordinateur (manifeste, icônes ; iOS : son icône à lui). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- L'aperçu d'un lien partagé (Discord, WhatsApp…), celui du site : le même que fait le
         Worker pour les robots d'aperçu (`SITE_SUMMARY`, `worker/vitrine.ts`), adresses
         complètes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PokéCodex" />
    <meta property="og:title" content="PokéCodex" />
    <meta
      property="og:description"
      content="Un Pokédex de cartes Pokémon japonaises et françaises : une carte par Pokémon, à collectionner."
    />
    <meta property="og:url" content="https://pokecodex.fr/" />
    <meta property="og:image" content="https://pokecodex.fr/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <title>PokéCodex</title>
    <!-- Le thème, avant le premier affichage : un script bloquant, mais un fichier du site. -->
    <script src="/theme.js"></script>
    <!-- Le compte (qui est connecté), que l'app attend avant tout affichage (`loadAccount`,
         `main.tsx`) : demandé dès maintenant, sans attendre le script. `crossorigin` : la même
         demande que son `fetch` (mode cors, cookies du site seulement), sinon le navigateur la
         referait. Les espèces, elles, ne servent qu'une fois connecté (et au Pokédex public) :
         le Worker les fait précharger quand le navigateur a une session (l'en-tête `Link`,
         `worker/headers.ts`) ; un visiteur sur la connexion ne les télécharge pas. -->
    <link rel="preload" href="/api/account?demarrage" as="fetch" crossorigin />
    <!-- Les polices des premières pages, que le navigateur ne découvrirait qu'au premier affichage
         (le texte changerait alors de police sous les yeux) : le texte (Manrope 400), les champs
         et les boutons (Manrope 600), le nom du site et les titres des cartes (Space Grotesk 700).
         Les autres graisses (`main.tsx`) se chargent quand une page les emploie. -->
    <link
      rel="preload"
      href="/node_modules/@fontsource/manrope/files/manrope-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/manrope/files/manrope-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- L'attente du démarrage : la Poké Ball du logo, centrée (couleurs de la marque, `--brand-*`
         de `styles/theme.css`) ; React remplace ce contenu à son premier affichage. Un style dans
         la balise : la politique de sécurité les accepte, pas les scripts dans la page. -->
    <div id="root">
      <div style="position: fixed; inset: 0; display: grid; place-items: center">
        <svg
          viewBox="0 0 32 32"
          width="64"
          height="64"
          role="img"
          aria-label="Chargement du Pokédex"
        >
          <circle cx="16" cy="16" r="14" fill="#ffffff" />
          <path d="M2 16a14 14 0 0 1 28 0Z" fill="#e3350d" />
          <path d="M2 16h28" stroke="#1f1f22" stroke-width="2.5" />
          <circle cx="16" cy="16" r="5.25" fill="#1f1f22" />
          <circle cx="16" cy="16" r="3" fill="#ffffff" />
          <circle cx="16" cy="16" r="14" fill="none" stroke="#1f1f22" stroke-width="2" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
