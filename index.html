<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mon Pokédex de cartes Pokémon japonaises." />
    <meta name="theme-color" content="#141414" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mon Pokédex</title>
    <script>
      // Le thème, posé avant le premier affichage (sans éclair de l'autre) : celui choisi dans ce
      // navigateur, sinon celui du système. La même règle que `src/store/theme.ts`.
      try {
        const stored = localStorage.getItem('pokedex-collection.theme')
        const light = stored ? stored === 'light' : matchMedia('(prefers-color-scheme: light)').matches
        if (light) {
          document.documentElement.dataset.camplyTheme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#faf6f3'
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
